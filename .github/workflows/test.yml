name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Add a plugin here when it gains a test/<plugin>/test.bats suite.
        plugin:
          - no-co-authored
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: npm ci

      - name: Run ${{ matrix.plugin }} test suite
        run: BATS_LIB_PATH="$PWD/node_modules" npx bats "test/${{ matrix.plugin }}/"
