name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Add a plugin here when it gains a test/<plugin>/test.bats suite.
        plugin:
          - no-co-authored
          - git-sign-key
          - cctools-edit
          - branch-management
          - superpowers-automation
          - claude-code-knowledge
          - cave-context
          - init
          - coding-toolbox
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install bats
        run: |
          sudo apt-get update -qq && sudo apt-get install -y bats
          sudo mkdir -p /usr/lib/bats
          sudo git clone --depth 1 https://github.com/bats-core/bats-support.git /usr/lib/bats/bats-support
          sudo git clone --depth 1 https://github.com/bats-core/bats-assert.git /usr/lib/bats/bats-assert

      - name: Run ${{ matrix.plugin }} test suite
        env:
          BATS_LIB_PATH: /usr/lib/bats
        run: bats "test/${{ matrix.plugin }}/"

  # Single stable check that aggregates the whole test matrix — use this as the
  # required status check (merge guard) in branch protection. It is green only
  # when every matrix leg succeeded; `if: always()` makes it run (and fail) even
  # when a leg fails, instead of being skipped.
  test-gate:
    name: Test gate
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require all test matrix jobs to succeed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test matrix did not fully succeed (result: ${{ needs.test.result }})."
            exit 1
          fi
          echo "All test matrix jobs succeeded."
