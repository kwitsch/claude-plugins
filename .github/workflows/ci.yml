name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-marketplace:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate marketplace manifest
        run: |
          manifest=".claude-plugin/marketplace.json"
          test -f "${manifest}" || { echo "Missing ${manifest}"; exit 1; }
          jq empty "${manifest}"

          # Required top-level fields per the marketplace spec.
          jq -e '.name and .owner and (.plugins | type == "array")' "${manifest}" \
            > /dev/null || { echo "marketplace.json must define name, owner and a plugins array"; exit 1; }

          # Each plugin entry must define at least name + source.
          jq -e 'all(.plugins[]; .name and .source)' "${manifest}" \
            > /dev/null || { echo "Every plugin entry must define name and source"; exit 1; }

      - name: Validate plugin sources and manifests
        run: |
          manifest=".claude-plugin/marketplace.json"
          # String sources are full ./plugins/<name> paths resolved from the marketplace root.
          # The metadata.pluginRoot fallback below is kept forward-compatible pending
          # anthropics/claude-code#61224; pluginRoot is intentionally unused for now.
          root="$(jq -r '.metadata.pluginRoot // "."' "${manifest}")"
          while IFS= read -r source; do
            case "${source}" in
              remote)
                # Non-path sources (github/url/git-subdir/npm) are remote; nothing to check locally.
                echo "Skipping remote source entry"
                ;;
              *)
                dir="${root}/${source}"
                test -d "${dir}" || { echo "Plugin source directory not found: ${dir}"; exit 1; }
                plugin_manifest="${dir}/.claude-plugin/plugin.json"
                if [ -f "${plugin_manifest}" ]; then
                  jq empty "${plugin_manifest}"
                fi
                ;;
            esac
          done < <(jq -r '.plugins[].source | if type == "string" then . else "remote" end' "${manifest}")

  # Merge guard: plugin versions live ONLY in each plugin's own plugin.json
  # (single source of truth — Claude Code lets plugin.json win silently over a
  # marketplace entry anyway, and the official docs advise against declaring
  # both). A marketplace entry that carries a version, or a local plugin
  # manifest without one, fails here and (as a required status check in
  # branch protection) blocks the merge.
  version-consistency:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Plugin versions declared once, in plugin.json only
        run: |
          manifest=".claude-plugin/marketplace.json"
          # pluginRoot fallback kept forward-compatible (see Validate job); sources
          # are full ./plugins/<name> paths and pluginRoot is intentionally unused for now.
          root="$(jq -r '.metadata.pluginRoot // "."' "${manifest}")"
          status=0

          # No marketplace entry may carry a version field.
          while IFS= read -r name; do
            echo "::error::${name}: marketplace.json entry declares a version — plugin.json is the single source of truth"
            status=1
          done < <(jq -r '.plugins[] | select(has("version")) | .name' "${manifest}")

          # Every local plugin manifest must declare one.
          while IFS=$'\t' read -r name source; do
            case "${source}" in
              remote)
                echo "${name}: remote source — skipping version check"
                ;;
              *)
                plugin_manifest="${root}/${source}/.claude-plugin/plugin.json"
                if [ ! -f "${plugin_manifest}" ]; then
                  echo "::error::${name}: plugin manifest not found at ${plugin_manifest}"
                  status=1
                  continue
                fi
                pl_version="$(jq -r '.version // empty' "${plugin_manifest}")"
                if [ -z "${pl_version}" ]; then
                  echo "::error::${name}: ${plugin_manifest} declares no version"
                  status=1
                else
                  echo "${name}: ${pl_version} OK"
                fi
                ;;
            esac
          done < <(jq -r '.plugins[] | [.name, (.source | if type == "string" then . else "remote" end)] | @tsv' "${manifest}")

          exit "${status}"

  minor-bump-on-functional-change:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require plugin minor bump on functional changes
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          status=0
          declare -A touched

          while IFS= read -r file; do
            [[ "${file}" =~ ^plugins/([^/]+)/ ]] || continue
            plugin="${BASH_REMATCH[1]}"
            case "${file}" in
              "plugins/${plugin}/.claude-plugin/plugin.json"|"plugins/${plugin}/README.md"|"plugins/${plugin}/CLAUDE.md")
                ;;
              *)
                touched["${plugin}"]=1
                ;;
            esac
          done < <(git diff --name-only "${base_sha}" "${head_sha}" -- 'plugins/*')

          for plugin in "${!touched[@]}"; do
            manifest_rel="plugins/${plugin}/.claude-plugin/plugin.json"
            if ! git cat-file -e "${base_sha}:${manifest_rel}" 2>/dev/null; then
              echo "${plugin}: new plugin or missing manifest in base — skipping minor bump check"
              continue
            fi
            if [ ! -f "${manifest_rel}" ]; then
              echo "${plugin}: plugin removed in head — skipping minor bump check"
              continue
            fi

            base_version="$(git show "${base_sha}:${manifest_rel}" | jq -r '.version // empty')"
            head_version="$(jq -r '.version // empty' "${manifest_rel}")"

            if [[ ! "${base_version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::${plugin}: base version '${base_version}' is not strict semver (MAJOR.MINOR.PATCH)"
              status=1
              continue
            fi
            base_minor="${BASH_REMATCH[2]}"

            if [[ ! "${head_version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::${plugin}: head version '${head_version}' is not strict semver (MAJOR.MINOR.PATCH)"
              status=1
              continue
            fi
            head_minor="${BASH_REMATCH[2]}"

            if [ "${head_minor}" -le "${base_minor}" ]; then
              echo "::error::${plugin}: functional changes detected but minor version did not increase (${base_version} -> ${head_version})"
              status=1
            else
              echo "${plugin}: functional changes detected and minor version increased (${base_version} -> ${head_version})"
            fi
          done

          exit "${status}"
